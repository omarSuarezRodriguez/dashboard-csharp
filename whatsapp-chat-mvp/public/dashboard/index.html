<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WhatsApp</title>
    <link rel="stylesheet" href="/styles.css?v=7" />
  </head>
  <body>
    <div class="wa-app">
      <aside class="wa-sidebar">
        <header class="wa-sidebar-head">
          <div class="wa-profile">
            <div class="wa-avatar wa-avatar--lg" id="brand-avatar">WA</div>
            <div class="wa-profile-text">
              <span class="wa-profile-title">WhatsApp</span>
              <span class="wa-profile-sub" id="restaurant-name">Cargando…</span>
            </div>
          </div>
          <button type="button" class="wa-icon-btn" id="btn-new-chat" title="Nuevo chat">
            <svg viewBox="0 0 24 24" width="22" height="22">
              <path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
            </svg>
          </button>
        </header>
        <div class="wa-search">
          <span class="wa-search-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path
                fill="currentColor"
                d="M9.5 3A6.5 6.5 0 0 1 16 9.5c0 1.61-.59 3.09-1.56 4.23l.27.27h.79l5 5-1.5 1.5-5-5v-.79l-.27-.27A6.516 6.516 0 0 1 9.5 16 6.5 6.5 0 1 1 9.5 3m0 2C7 5 5 7 5 9.5S7 14 9.5 14 14 12 14 9.5 12 5 9.5 5z"
              />
            </svg>
          </span>
          <input type="search" id="search" placeholder="Buscar o empezar un chat nuevo" />
        </div>
        <ul id="conversation-list" class="wa-chats"></ul>
      </aside>

      <main class="wa-main" id="wa-main">
        <div class="wa-empty" id="wa-empty">
          <svg class="wa-empty-logo" viewBox="0 0 360 200" aria-hidden="true">
            <defs>
              <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#25d366;stop-opacity:0.9" />
                <stop offset="100%" style="stop-color:#00a884;stop-opacity:0.7" />
              </linearGradient>
            </defs>
            <ellipse cx="180" cy="100" rx="140" ry="70" fill="#1f2c34" opacity="0.6" />
            <path
              fill="url(#g1)"
              d="M180 45c-38 0-68 28-68 62 0 11 3 21 8 30l-6 22 23-7c9 5 20 8 32 8 38 0 68-28 68-62s-30-53-57-53z"
            />
            <path fill="#fff" opacity="0.9" d="M155 95h50v6h-50zm0 14h36v6h-36z" />
          </svg>
          <h2>WhatsApp Web</h2>
          <p>
            Envía y recibe mensajes sin mantener tu teléfono conectado.<br />
            Selecciona un chat de la izquierda para empezar.
          </p>
          <span id="sync-status" class="wa-sync-pill">Sincronizando…</span>
        </div>

        <div class="wa-chat" id="wa-chat">
          <header class="wa-chat-head">
            <div class="wa-chat-contact">
              <div class="wa-avatar" id="chat-avatar">?</div>
              <div>
                <h2 id="chat-title">Contacto</h2>
                <p id="chat-subtitle">mensajes de WhatsApp</p>
              </div>
            </div>
            <button type="button" class="wa-icon-btn wa-icon-btn--ghost" id="btn-rename-chat" title="Editar nombre">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path
                  fill="currentColor"
                  d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"
                />
              </svg>
            </button>
          </header>

          <div id="messages" class="wa-messages"></div>

          <form id="send-form" class="wa-footer">
            <div class="wa-compose">
              <div class="wa-compose-box">
                <textarea
                  id="message-input"
                  rows="1"
                  placeholder="Escribe un mensaje"
                  autocomplete="off"
                  required
                ></textarea>
              </div>
              <button type="submit" id="send-btn" class="wa-send" title="Enviar" aria-label="Enviar">
                <svg viewBox="0 0 24 24" width="24" height="24">
                  <path
                    fill="currentColor"
                    d="M1.101 21.757 23.8 12.024 1.101 2.291l.011 7.912 13.623 1.816-13.623 1.817-.011 7.912z"
                  />
                </svg>
              </button>
            </div>
          </form>
        </div>
      </main>
    </div>
    <dialog id="modal-new-chat" class="wa-modal">
      <form method="dialog" id="form-new-chat" class="wa-modal-box">
        <h3>Nuevo chat</h3>
        <label>
          Nombre (opcional)
          <input type="text" id="new-chat-name" placeholder="Ej: Juan Pérez" autocomplete="off" />
        </label>
        <label>
          WhatsApp (con código de país)
          <input
            type="tel"
            id="new-chat-phone"
            placeholder="Ej: +573001234567"
            required
            autocomplete="off"
          />
        </label>
        <div class="wa-modal-actions">
          <button type="button" class="wa-btn wa-btn--ghost" id="new-chat-cancel">Cancelar</button>
          <button type="submit" class="wa-btn wa-btn--primary">Crear chat</button>
        </div>
      </form>
    </dialog>

    <dialog id="modal-rename-chat" class="wa-modal">
      <form method="dialog" id="form-rename-chat" class="wa-modal-box">
        <h3>Editar nombre</h3>
        <label>
          Nombre del contacto
          <input type="text" id="rename-chat-name" required autocomplete="off" />
        </label>
        <p class="wa-modal-hint" id="rename-chat-phone"></p>
        <div class="wa-modal-actions">
          <button type="button" class="wa-btn wa-btn--ghost" id="rename-chat-cancel">Cancelar</button>
          <button type="submit" class="wa-btn wa-btn--primary">Guardar</button>
        </div>
      </form>
    </dialog>

    <div id="chat-context-menu" class="wa-context-menu" hidden role="menu">
      <button type="button" class="wa-context-menu__item wa-context-menu__item--danger" data-action="delete" role="menuitem">
        Eliminar chat
      </button>
    </div>

    <script src="/app.js?v=8" type="module"></script>
  </body>
</html>
